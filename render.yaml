# Reference configuration. Creating this paid service/disk requires a manual action in Render.
services:
  - type: web
    name: campus-events
    runtime: node
    branch: backend-improvements
    region: frankfurt
    plan: starter
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: campus-events-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_WEB
        value: "true"
      - key: DB_STORAGE
        value: /var/data/events.sqlite
      - key: CACHE_ENABLED
        value: "true"
      - key: CACHE_TTL_MS
        value: "30000"
      - key: CACHE_MAX_ENTRIES
        value: "500"
      - key: MAIL_ENABLED
        value: "false"
      - key: LOG_LEVEL
        value: info
