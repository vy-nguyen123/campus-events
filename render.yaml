# Free school demo. SQLite data is lost on sleep, restart, or redeploy.
services:
  - type: web
    name: campus-events
    runtime: node
    branch: backend-improvements
    region: frankfurt
    plan: free
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_WEB
        value: "true"
      - key: DB_STORAGE
        value: /tmp/campus-events.sqlite
      - key: CACHE_ENABLED
        value: "true"
      - key: CACHE_TTL_MS
        value: "30000"
      - key: CACHE_MAX_ENTRIES
        value: "500"
      - key: MAIL_ENABLED
        value: "false"
      - key: LOG_LEVEL
        value: info
      # Configure these privately when creating the Blueprint. Existing manual
      # services must add them in the dashboard; this file does not deploy changes.
      - key: MCP_TOKEN
        sync: false
      - key: MCP_ALLOWED_HOSTS
        sync: false
      - key: MCP_ALLOWED_ORIGINS
        sync: false
